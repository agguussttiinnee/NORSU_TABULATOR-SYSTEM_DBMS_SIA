<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NORSU Tabulator | My events</title>
  <link rel="stylesheet" href="/css/app.css">
  <style>
    body {
      margin: 0;
      background: var(--nt-page);
      font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
    }

    .event-card {
      padding: 16px;
      margin-top: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
    }

    .event-link {
      color: #2457a6;
      text-decoration: none;
      cursor: pointer;
    }

    .event-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="app-header" data-title="NORSU Tabulator System" data-subtitle="Judge area" data-role="judge"></div>

  <main class="nt-main">
    <section class="nt-card">
      <h2 id="welcome">Welcome</h2>
      <p class="nt-muted">The events you are assigned to will appear here.</p>
    </section>

    <section class="nt-card">
      <h2>My events</h2>
      <p id="eventsStatus" class="nt-muted">No events assigned yet. Your admin assigns judges to events.</p>
    </section>
  </main>

  <script src="/js/layout.js"></script>
  <script>
    // Display the logged-in judge's name.
    const user = window.NorsuAuth.getUser();

    if (user) {
      document.getElementById('welcome').textContent =
        'Welcome, ' + (user.full_name || user.email);
    }

    // Retrieve the events assigned to this judge.
    async function loadMyEvents() {
      const eventsStatus = document.getElementById('eventsStatus');

      try {
        const response = await fetch('/api/event-judges/mine', {
          headers: {
            Authorization: 'Bearer ' + window.NorsuAuth.getToken()
          }
        });

        const result = await response.json();

        if (!response.ok || !result.success) {
          eventsStatus.textContent = result.message || 'Unable to load events.';
          return;
        }

        const events = result.data || [];

        if (events.length === 0) {
          eventsStatus.textContent = 'No events assigned yet.';
          return;
        }

        const eventList = document.createElement('div');

        events.forEach(function(event) {
          const card = document.createElement('div');
          card.className = 'event-card';

          const name = document.createElement('h3');
          const link = document.createElement('a');

          link.className = 'event-link';
          link.textContent = event.event_name;
          link.href = '/judge-scoring.html?eventId=' +
            encodeURIComponent(event.event_id);

          name.appendChild(link);

          const details = document.createElement('p');
          details.textContent =
            'Type: ' + (event.event_type || 'N/A') +
            ' | Venue: ' + (event.venue_name || 'N/A') +
            ' | Date: ' + (event.event_date || 'N/A') +
            ' | Status: ' + (event.status || 'N/A');

          card.appendChild(name);
          card.appendChild(details);
          eventList.appendChild(card);
        });

        eventsStatus.replaceWith(eventList);

      } catch (error) {
        console.error('Error loading assigned events:', error);
        eventsStatus.textContent = 'Unable to load your assigned events.';
      }
    }

    loadMyEvents();
  </script>
</body>
</html>
