<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NORSU Tabulator | Colleges</title>
<link rel="stylesheet" href="/css/app.css">
<style>
:root{color-scheme:light;--navy:#10264d;--blue:#2459a9;--line:#dbe3ef;--muted:#63718a;--bg:#f3f6fb}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;color:#18253b;background:var(--bg)}
main{max-width:1080px;margin:22px auto;padding:0 20px 36px}
.grid{display:grid;grid-template-columns:minmax(270px,360px) 1fr;gap:18px;align-items:start}
.card{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 6px 24px #152b4c0a}
h2{margin:0 0 14px;font-size:19px}
label{display:block;font-size:13px;font-weight:700;margin:11px 0 5px}
input{width:100%;padding:10px 11px;border:1px solid #cbd5e3;border-radius:9px;font:inherit;background:white}
input:focus{outline:3px solid #b9d4ff;border-color:var(--blue)}
button{border:0;background:var(--blue);color:white;padding:10px 13px;border-radius:9px;cursor:pointer;font:inherit;font-weight:700}
button.secondary{background:#e8eef8;color:#23436f}
button.danger{background:#a6313a}
button.small{padding:6px 9px;font-size:13px;margin:2px}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.muted{color:var(--muted);font-size:13px}
.notice{padding:10px 12px;border-radius:9px;margin:0 0 16px;background:#edf4ff;color:#173b76;white-space:pre-wrap}
.notice.error{background:#fff0f0;color:#8c2028}
.report-row{display:flex;gap:8px;align-items:end}
.report-row>div{flex:1;max-width:260px}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:500px}
th,td{padding:10px 9px;text-align:left;border-bottom:1px solid #e8edf5;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#5d6d86;background:#f8faff}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app-header" data-title="NORSU Tabulator System" data-subtitle="Colleges management · Master data module" data-role="admin"></div>
<script src="/js/layout.js"></script>

<main>
<div id="notice" class="notice" role="status">Loading colleges…</div>

<div class="grid">
<section class="card">
<h2 id="formTitle">Add college</h2>
<form id="collegeForm">
<input id="collegeId" type="hidden">
<label for="name">College name</label>
<input id="name" maxlength="100" required placeholder="e.g. College of Education">

<label for="code">College code</label>
<input id="code" maxlength="20" required placeholder="e.g. COED">

<div class="actions">
<button type="submit" id="submitCollege">Add college</button>
<button type="button" class="secondary" id="cancelEdit" hidden>Cancel edit</button>
<button type="button" class="secondary" id="refresh">Refresh list</button>
</div>
</form>
</section>

<section class="card">
<h2>Active colleges</h2>
<div class="table-wrap">
<table>
<thead><tr><th>ID</th><th>Name</th><th>Code</th><th>Actions</th></tr></thead>
<tbody id="collegesBody">
<tr><td colspan="4" class="muted">Loading…</td></tr>
</tbody>
</table>
</div>
</section>
</div>

<section class="card" style="margin-top:18px">
<h2>Colleges with no participants in an event</h2>
<p class="muted">LEFT JOIN report: colleges that have no registered participant in the chosen event.</p>
<div class="report-row">
<div>
<label for="reportEventId">Event ID</label>
<input id="reportEventId" type="number" min="1" step="1" placeholder="e.g. 1">
</div>
<button id="runReport" type="button">Run report</button>
</div>
<div class="table-wrap">
<table>
<thead><tr><th>ID</th><th>Name</th><th>Code</th></tr></thead>
<tbody id="reportBody">
<tr><td colspan="3" class="muted">Enter an event ID and click Run report.</td></tr>
</tbody>
</table>
</div>
</section>
</main>

<script>
const API='/api';
const $=id=>document.getElementById(id);

function show(message,isError=false){
  $('notice').textContent=message;
  $('notice').classList.toggle('error',isError);
}

async function api(path,options={}){
  const response=await fetch(`${API}${path}`,{
    ...options,
    headers:{
      ...(options.body!==undefined?{'Content-Type':'application/json'}:{}),
      Authorization:`Bearer ${NorsuAuth.getToken()}`,
      ...(options.headers||{})
    }
  });

  if(response.status===401){NorsuAuth.logout();throw new Error('Session expired. Please log in again.');}

  let payload;
  try{payload=await response.json();}
  catch{throw new Error(`Server returned HTTP ${response.status} without JSON`);}

  if(!response.ok||payload.success===false){
    throw new Error(payload.message||`Request failed (${response.status})`);
  }
  return payload.data;
}

function esc(value){
  return String(value??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function resetForm(){
  $('collegeForm').reset();
  $('collegeId').value='';
  $('formTitle').textContent='Add college';
  $('submitCollege').textContent='Add college';
  $('cancelEdit').hidden=true;
}

async function loadColleges(){
  $('collegesBody').innerHTML='<tr><td colspan="4" class="muted">Loading colleges…</td></tr>';
  try{
    const colleges=await api('/colleges');
    $('collegesBody').innerHTML=colleges.length?colleges.map(c=>`<tr>
      <td>${esc(c.id)}</td>
      <td><strong>${esc(c.name)}</strong></td>
      <td>${esc(c.code)}</td>
      <td>
        <button class="small secondary" data-edit="${esc(c.id)}">Edit</button>
        <button class="small danger" data-delete="${esc(c.id)}">Delete</button>
      </td>
    </tr>`).join(''):'<tr><td colspan="4" class="muted">No active colleges found.</td></tr>';
    show(`Loaded ${colleges.length} active college(s).`);
  }catch(e){
    $('collegesBody').innerHTML='<tr><td colspan="4" class="muted">Unable to load colleges.</td></tr>';
    show(e.message,true);
  }
}

$('refresh').addEventListener('click',loadColleges);
$('cancelEdit').addEventListener('click',resetForm);

$('collegeForm').addEventListener('submit',async event=>{
  event.preventDefault();
  const id=$('collegeId').value;
  const payload={name:$('name').value.trim(),code:$('code').value.trim()};
  try{
    await api(id?`/colleges/${id}`:'/colleges',{method:id?'PUT':'POST',body:JSON.stringify(payload)});
    resetForm();
    await loadColleges();
    show(id?'College updated.':'College added.');
  }catch(e){show(e.message,true);}
});

$('collegesBody').addEventListener('click',async event=>{
  const editId=event.target.getAttribute('data-edit');
  const deleteId=event.target.getAttribute('data-delete');

  if(editId){
    try{
      const c=await api(`/colleges/${editId}`);
      $('collegeId').value=c.id;
      $('name').value=c.name;
      $('code').value=c.code;
      $('formTitle').textContent=`Edit college #${c.id}`;
      $('submitCollege').textContent='Save changes';
      $('cancelEdit').hidden=false;
      window.scrollTo({top:0,behavior:'smooth'});
    }catch(e){show(e.message,true);}
  }

  if(deleteId&&confirm(`Delete college #${deleteId}? It will be hidden, not erased.`)){
    try{
      await api(`/colleges/${deleteId}`,{method:'DELETE'});
      await loadColleges();
      show(`College #${deleteId} deleted.`);
    }catch(e){show(e.message,true);}
  }
});

async function runReport(){
  const eventId=$('reportEventId').value.trim();
  if(!eventId){show('Enter an event ID first.',true);return;}
  $('reportBody').innerHTML='<tr><td colspan="3" class="muted">Loading report…</td></tr>';
  try{
    const rows=await api(`/colleges/report/no-participants?eventId=${encodeURIComponent(eventId)}`);
    $('reportBody').innerHTML=rows.length?rows.map(c=>`<tr>
      <td>${esc(c.id)}</td><td><strong>${esc(c.name)}</strong></td><td>${esc(c.code)}</td>
    </tr>`).join(''):'<tr><td colspan="3" class="muted">Every college has at least one participant in this event.</td></tr>';
    show(`Report loaded: ${rows.length} college(s) with no participants in event ${eventId}.`);
  }catch(e){
    $('reportBody').innerHTML='<tr><td colspan="3" class="muted">Unable to load report.</td></tr>';
    show(e.message,true);
  }
}
$('runReport').addEventListener('click',runReport);

loadColleges();
</script>
</body>
</html>
