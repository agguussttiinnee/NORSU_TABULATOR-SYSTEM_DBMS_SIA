<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NORSU Tabulator | Events</title>
<link rel="stylesheet" href="/css/app.css">
<style>
*{box-sizing:border-box}
body{margin:0;background:var(--nt-page);color:var(--nt-text);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
main{max-width:1180px;margin:24px auto;padding:0 20px 40px}
.grid{display:grid;grid-template-columns:minmax(280px,380px) minmax(0,1fr);gap:18px;align-items:start}
.card{background:#fff;border:1px solid var(--nt-line);border-radius:16px;padding:20px;box-shadow:0 6px 24px #152b4c0a}
h2{margin:0 0 14px;font-size:19px}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 5px}
input,select{width:100%;padding:10px 11px;border:1px solid #cbd5e3;border-radius:9px;font:inherit;background:#fff;color:var(--nt-text)}
input:focus,select:focus{outline:3px solid #b9d4ff;border-color:var(--nt-blue)}
button{border:0;background:var(--nt-blue);color:#fff;padding:10px 13px;border-radius:9px;cursor:pointer;font:inherit;font-weight:700}
button.secondary{background:#e8eef8;color:#23436f}
button.danger{background:#a6313a}
button.small{padding:6px 9px;font-size:13px;margin:2px}
button:disabled{opacity:.6;cursor:not-allowed}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.muted{color:var(--nt-muted);font-size:13px}
.notice{padding:10px 12px;border-radius:9px;margin:0 0 18px;background:#edf4ff;color:#173b76;white-space:pre-wrap}
.notice.error{background:#fff0f0;color:#8c2028}
.table-wrap{overflow:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th,td{padding:10px 9px;text-align:left;border-bottom:1px solid #e8edf5;vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:#5d6d86;background:#f8faff}
.status{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef2f8;font-size:12px;font-weight:700}
@media(max-width:850px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app-header" data-title="NORSU Tabulator System" data-subtitle="Events management · Transactions module" data-role="admin"></div>

<main>
<div id="notice" class="notice" role="status">Checking your administrator session…</div>
<div class="grid">
<section class="card">
<h2 id="formTitle">Create event</h2>
<form id="eventForm">
<input id="eventId" type="hidden">
<label for="event_name">Event name</label>
<input id="event_name" maxlength="100" required placeholder="e.g. NORSU College Pageant">

<label for="event_type_id">Event type</label>
<select id="event_type_id" required><option value="">Loading event types…</option></select>

<label for="venue_id">Venue</label>
<select id="venue_id" required><option value="">Loading venues…</option></select>

<label for="event_date">Event date and time</label>
<input id="event_date" type="datetime-local" required>

<label for="status">Status</label>
<select id="status" required>
<option value="scheduled">Scheduled</option>
<option value="ongoing">Ongoing</option>
<option value="completed">Completed</option>
<option value="cancelled">Cancelled</option>
</select>

<div class="actions">
<button type="submit" id="submitEvent">Create event</button>
<button type="button" class="secondary" id="cancelEdit" hidden>Cancel edit</button>
<button type="button" class="secondary" id="refresh">Refresh list</button>
</div>
<p class="muted">Event type and venue options are loaded from the shared master-data lookup endpoint.</p>
</form>
</section>

<section class="card">
<h2>Active events</h2>
<div class="table-wrap">
<table>
<thead><tr><th>ID</th><th>Event</th><th>Type</th><th>Venue</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
<tbody id="eventsBody"><tr><td colspan="7" class="muted">Events have not been loaded yet.</td></tr></tbody>
</table>
</div>
</section>
</div>
</main>

<script src="/js/layout.js"></script>
<script src="/js/transaction-auth.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const api = window.NorsuTransaction.api;
let lookups = { eventTypes: [], venues: [], colleges: [] };

function show(message, isError = false) {
    $('notice').textContent = message;
    $('notice').classList.toggle('error', isError);
}

function esc(value) {
    return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[character]));
}

function mysqlToInput(value) {
    return value ? String(value).replace(' ', 'T').slice(0, 16) : '';
}

function fillSelect(id, rows, placeholder, selectedValue = '') {
    const select = $(id);
    select.innerHTML = `<option value="">${esc(placeholder)}</option>` + rows.map(row =>
        `<option value="${esc(row.id)}">${esc(row.name)}</option>`
    ).join('');
    if (selectedValue !== '') select.value = String(selectedValue);
}

async function loadLookups() {
    lookups = await api('/events/lookups');
    fillSelect('event_type_id', lookups.eventTypes || [], 'Select an event type');
    fillSelect('venue_id', lookups.venues || [], 'Select a venue');
    if (!lookups.eventTypes?.length || !lookups.venues?.length) {
        show('Master data is empty. Add event types and venues before creating events.', true);
    }
}

function resetForm() {
    $('eventForm').reset();
    $('eventId').value = '';
    $('formTitle').textContent = 'Create event';
    $('submitEvent').textContent = 'Create event';
    $('cancelEdit').hidden = true;
}

async function loadEvents() {
    $('eventsBody').innerHTML = '<tr><td colspan="7" class="muted">Loading events…</td></tr>';
    try {
        const events = await api('/events');
        if (!events.length) {
            $('eventsBody').innerHTML = '<tr><td colspan="7" class="muted">No active events found.</td></tr>';
        } else {
            const typeNames = new Map((lookups.eventTypes || []).map(item => [String(item.id), item.name]));
            const venueNames = new Map((lookups.venues || []).map(item => [String(item.id), item.name]));
            $('eventsBody').innerHTML = events.map(item => `<tr>
                <td>${esc(item.id)}</td>
                <td><strong>${esc(item.event_name)}</strong></td>
                <td>${esc(typeNames.get(String(item.event_type_id)) || `ID ${item.event_type_id}`)}</td>
                <td>${esc(venueNames.get(String(item.venue_id)) || `ID ${item.venue_id}`)}</td>
                <td>${esc(item.event_date)}</td>
                <td><span class="status">${esc(item.status)}</span></td>
                <td>
                    <button class="small secondary" type="button" data-edit="${esc(item.id)}">Edit</button>
                    <button class="small danger" type="button" data-delete="${esc(item.id)}">Deactivate</button>
                    <a href="/participant-registration.html?event_id=${encodeURIComponent(item.id)}">Register</a>
                </td>
            </tr>`).join('');
        }
        show(`Loaded ${events.length} active event(s).`);
    } catch (error) {
        $('eventsBody').innerHTML = '<tr><td colspan="7" class="muted">Unable to load events.</td></tr>';
        show(`${error.message}\nCheck the API, database, and administrator account.`, true);
    }
}

$('eventForm').addEventListener('submit', async event => {
    event.preventDefault();
    const id = $('eventId').value;
    const payload = {
        event_name: $('event_name').value.trim(),
        event_type_id: Number($('event_type_id').value),
        venue_id: Number($('venue_id').value),
        event_date: $('event_date').value,
        status: $('status').value
    };
    try {
        await api(id ? `/events/${id}` : '/events', {
            method: id ? 'PATCH' : 'POST',
            body: JSON.stringify(payload)
        });
        show(id ? 'Event updated.' : 'Event created.');
        resetForm();
        await loadEvents();
    } catch (error) {
        show(error.message, true);
    }
});

$('eventsBody').addEventListener('click', async event => {
    const editButton = event.target.closest('[data-edit]');
    const deleteButton = event.target.closest('[data-delete]');
    if (editButton) {
        try {
            const item = await api(`/events/${editButton.dataset.edit}`);
            $('eventId').value = item.id;
            $('event_name').value = item.event_name;
            $('event_type_id').value = String(item.event_type_id);
            $('venue_id').value = String(item.venue_id);
            $('event_date').value = mysqlToInput(item.event_date);
            $('status').value = item.status;
            $('formTitle').textContent = `Edit event #${item.id}`;
            $('submitEvent').textContent = 'Save changes';
            $('cancelEdit').hidden = false;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (error) {
            show(error.message, true);
        }
    }
    if (deleteButton && confirm(`Deactivate event #${deleteButton.dataset.delete}? Existing registrations will remain.`)) {
        try {
            await api(`/events/${deleteButton.dataset.delete}`, { method: 'DELETE' });
            show(`Event #${deleteButton.dataset.delete} deactivated.`);
            await loadEvents();
        } catch (error) {
            show(error.message, true);
        }
    }
});

$('cancelEdit').addEventListener('click', resetForm);
$('refresh').addEventListener('click', loadEvents);

(async function start() {
    try {
        await window.NorsuTransaction.requireAdmin();
        await loadLookups();
        await loadEvents();
    } catch (error) {
        show(error.message, true);
    }
})();
</script>
</body>
</html>
